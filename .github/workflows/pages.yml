name: Publish photo note

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # 公開用ファイルを作って預ける段階と、預け終わってから公開する段階を分ける。
  # 同じ段階で続けて行うと、預けた直後のファイルが見つからず公開に失敗することがあるため。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload application only
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
